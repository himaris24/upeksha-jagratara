# netlify.toml — taruh file ini di ROOT repo (26_upeksha_jagratara/),
# SEJAJAR dengan PRD.md/DESIGN.md/README.md, BUKAN di dalam public/

[build]
  publish = "public"

# Header keamanan dasar (opsional tapi gratis & baik buat dibiasakan)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
