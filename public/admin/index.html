<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Panel Admin Upeksha Jagratara</title>
  <meta name="robots" content="noindex">

  <!-- PWA Manifest & Theme -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1B4B66">

  <!-- Favicon Utama -->
  <link rel="icon" type="image/png" href="/assets/logo/favicon.png">
  <link rel="apple-touch-icon" href="/assets/logo/favicon-192.png">

  <script>
    // Cegah Sveltia CMS menimpa favicon dengan logo full-lockup secara dinamis
    const observerHead = new MutationObserver((mutations) => {
      mutations.forEach((mutation) => {
        mutation.addedNodes.forEach((node) => {
          if (node.tagName === 'LINK' && node.getAttribute('rel')?.includes('icon')) {
            if (!node.href.includes('favicon.png')) {
              node.href = '/assets/logo/favicon.png';
            }
          }
        });
      });
    });
    observerHead.observe(document.head, { childList: true, subtree: true });

    window.addEventListener('DOMContentLoaded', () => {
      setInterval(() => {
        const icons = document.querySelectorAll("link[rel*='icon']");
        icons.forEach(icon => {
          if (!icon.href.includes('favicon.png')) {
            icon.href = '/assets/logo/favicon.png';
          }
        });
      }, 500);
    });
  </script>

  <style>
    @media (max-width: 767px) {
      .mobile-admin-title {
        display: block !important;
        text-align: center !important;
        width: 100% !important;
        line-height: 1.4 !important;
      }
    }
  </style>
</head>

<body>
  <script src="https://unpkg.com/@sveltia/cms@0.171.0/dist/sveltia-cms.js" type="module"></script>
  <script>
    let hasChanged = false;
    const observer = new MutationObserver(() => {
      if (hasChanged) return;
      const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
      let node;
      while (node = walker.nextNode()) {
        if (node.nodeValue.trim() === 'Panel Admin Upeksha Jagratara' || node.nodeValue.trim() === 'Sveltia CMS') {
          const parent = node.parentElement;
          if (parent) {
            if (window.innerWidth < 768) {
              parent.innerHTML = 'Panel Admin<br>Upeksha Jagratara';
              parent.classList.add('mobile-admin-title');
            } else {
              node.nodeValue = 'Panel Admin Upeksha Jagratara';
            }
          }
          hasChanged = true;
          observer.disconnect();
          break;
        }
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  </script>
</body>

</html>
